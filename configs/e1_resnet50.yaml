base: base.yaml
experiment: e1_resnet50

# E1 - Baseline CNN: Full fine-tuning ResNet-50 pretrained ImageNet-1K tren cung split 80/20 (seed 42)
# Sai khac duy nhat so voi base.yaml (ViT-B/16):
#   - model.name: resnet50 (23,583,845 tham so cho 37 lop)
#   - optimizer.lr: 0.01 va weight_decay: 0.0001 (chuan fine-tune CNN/ResNet-50 voi SGD + cosine decay)
model:
  name: resnet50
  num_classes: 37
  pretrained: true
  strategy: full
  unfreeze_last_k: 0

optimizer:
  name: sgd
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0001
  layer_decay: 1.0
